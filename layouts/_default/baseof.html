<html lang="{{ site.LanguageCode }}">
	<head>
		<title>{{ site.Title }}</title>
		<meta http-equiv="content-type" content="text/html; charset=utf-8" />
		<meta name="description" content="" />
		<meta name="keywords" content="" />
		<link href='/css/lato.css' rel='stylesheet' type='text/css'>
		<script src="/js/jquery.min.js"></script>
		<script src="/js/skel.min.js"></script>
		<script src="/js/skel-panels.min.js"></script>
		<script src="/js/init.js"></script>
		<script src="/js/theme.js"></script>
		<link href="/css/dark.css" rel="stylesheet" type="text/css">
		<noscript>
			<link rel="stylesheet" href="/css/style.css" />
		</noscript>
	</head>

	<body>
		<div id="wrapper">
			{{ partial "header.html" . }}
			<div id="page">
				<div class="container">
					<div class="row">
						{{ partial "sidebar.html" . }}
						<div class="9u skel-cell-important">
							<section id="content">
								<header>
									<h3>{{ .Title }}</h3>
								</header>
								{{ block "main" . }}{{ end }}
							</section>
						</div>
					</div>
				</div>
			</div>
			<div id="footer-theme">
				<span class="credit">Based on <a href="https://templated.live/synchronous/">Synchronous</a> by TEMPLATED (<a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>), modified</span>
				<button type="button" class="theme-toggle">Dark mode</button>
			</div>
		</div>
	</body>
</html>
